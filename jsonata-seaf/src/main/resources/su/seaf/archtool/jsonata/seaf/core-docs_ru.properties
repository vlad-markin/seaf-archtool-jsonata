# Descriptions of the SEAF core functions (CAP-8): summary, parameters (name:type, ? for optional), result, examples.
# Examples are evaluated by CoreFunctionsTest. UTF-8.

lookup.summary=Значение по ключу (переопределяет стандартную $lookup): ключ null даёт null, с одним аргументом ищет ключ в контексте, для массива собирает значения из всех элементов.
lookup.params=object:x,key:s
lookup.param.object=Объект или массив объектов; если аргумент один, объект берётся из контекста
lookup.param.key=Ключ; null — результат null
lookup.result.type=x
lookup.result=Значение или массив значений
lookup.example.1=$lookup({"a": 1}, "a") => 1
lookup.example.2=$lookup({"a": 1}, null) => null
lookup.example.3=$lookup([{"a": 1}, {"a": [2, 3]}], "a") => [1,2,3]

tryexecute.summary=Вызывает функцию и перехватывает её ошибку: {success, result} или {success: false, result: null, error}. Ошибки лимитов (глубина, время, отмена, бюджеты) не перехватываются.
tryexecute.params=function:f,args:a?
tryexecute.param.function=Вызываемая функция
tryexecute.param.args=Аргументы массивом; без аргумента — вызов без аргументов, null передаётся как есть, другое значение — {success: false}
tryexecute.result.type=o
tryexecute.result=Объект с полями success, result и error
tryexecute.example.1=$tryexecute(function($a, $b){ $a + $b }, [1, 2]) => {"success":true,"result":3}
tryexecute.example.2=$tryexecute(function(){ $error("плохо") }) => {"success":false,"result":null,"error":"плохо"}

jsonschema.summary=Функция проверки значения по JSON Schema (draft-07, форматы ajv-formats): true или список ошибок в форме ajv.
jsonschema.params=schema:o
jsonschema.param.schema=JSON Schema; ошибка схемы — X0012
jsonschema.result.type=f
jsonschema.result=Функция от проверяемого значения: true или массив ошибок {instancePath, schemaPath, keyword, params, message}
jsonschema.example.1=$jsonschema({"type": "number"})(1) => true
jsonschema.example.2=$jsonschema({"type": "number"})("a").keyword => "type"

set.summary=Запоминает значение по ключу до конца вычисления.
set.params=key:s,value:x
set.param.key=Ключ
set.param.value=Значение
set.result.type=x
set.result=Записанное значение
set.example.1=($set("k", 5); $get("k")) => 5

get.summary=Значение, записанное $set в этом вычислении.
get.params=key:s
get.param.key=Ключ
get.result.type=x
get.result=Значение или undefined
get.example.1=$get("нет") => undefined

log.summary=Пишет значение в журнал хоста и возвращает его.
log.params=tag:s?,content:x
log.param.tag=Метка записи (если аргументов два)
log.param.content=Значение для журнала
log.result.type=x
log.result=То же значение
log.example.1=$log("метка", 42) => 42

parsesource.summary=Загружает и разбирает источник данных через хост (единственный ввод-вывод выражения); манифест — вход вычисления.
parsesource.params=source:x
parsesource.param.source=Источник: путь в озере, URL из разрешённого списка или описание источника
parsesource.result.type=x
parsesource.result=Разобранные данные источника

manifestschema.summary=JSON Schema манифеста портала.
manifestschema.result.type=o
manifestschema.result=Схема манифеста

versions.summary=Версии частей портала.
versions.result.type=o
versions.result=Объект с версиями
