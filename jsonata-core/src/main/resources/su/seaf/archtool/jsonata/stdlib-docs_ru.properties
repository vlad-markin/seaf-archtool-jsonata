# Descriptions of the jsonata-js 2.2.2 standard library for the function catalog (CAP-8), in Russian.
# Per function: summary, params (names in signature order), param.<name>, result, example.<n> = "<expr> => <JSON or undefined>".
# Every example is evaluated by CatalogTest. The file is read as UTF-8.

sum.summary=Сумма чисел массива. Для пустого массива — 0.
sum.params=array
sum.param.array=Массив чисел (одно число считается массивом из одного элемента)
sum.result=Сумма
sum.example.1=$sum([1, 2, 3.5]) => 6.5

count.summary=Число элементов массива. Отсутствующее значение даёт 0.
count.params=array
count.param.array=Массив или одно значение
count.result=Число элементов
count.example.1=$count([1, 2, 3]) => 3

max.summary=Наибольшее число массива. Для пустого массива — нет значения.
max.params=array
max.param.array=Массив чисел
max.result=Наибольшее число
max.example.1=$max([1, 7, 3]) => 7

min.summary=Наименьшее число массива. Для пустого массива — нет значения.
min.params=array
min.param.array=Массив чисел
min.result=Наименьшее число
min.example.1=$min([1, 7, 3]) => 1

average.summary=Среднее арифметическое чисел массива. Для пустого массива — нет значения.
average.params=array
average.param.array=Массив чисел
average.result=Среднее
average.example.1=$average([1, 2, 6]) => 3

string.summary=Значение в виде строки: строка — как есть, остальное — как JSON. Числа — по правилам JSONata (15 значащих цифр).
string.params=value,prettify
string.param.value=Любое значение; без аргумента — контекст
string.param.prettify=true — JSON с отступами
string.result=Строка
string.example.1=$string({"a": [1, 2]}) => "{\\"a\\":[1,2]}"

substring.summary=Часть строки с позиции start длиной length (позиции считаются по символам Unicode, отрицательная — от конца).
substring.params=str,start,length
substring.param.str=Строка; без аргумента — контекст
substring.param.start=Начальная позиция, с 0
substring.param.length=Длина; без неё — до конца строки
substring.result=Подстрока
substring.example.1=$substring("Hello World", 3, 5) => "lo Wo"

substringBefore.summary=Часть строки до первого вхождения подстроки; если её нет — вся строка.
substringBefore.params=str,chars
substringBefore.param.str=Строка; без аргумента — контекст
substringBefore.param.chars=Искомая подстрока
substringBefore.result=Подстрока
substringBefore.example.1=$substringBefore("Hello World", " ") => "Hello"

substringAfter.summary=Часть строки после первого вхождения подстроки; если её нет — вся строка.
substringAfter.params=str,chars
substringAfter.param.str=Строка; без аргумента — контекст
substringAfter.param.chars=Искомая подстрока
substringAfter.result=Подстрока
substringAfter.example.1=$substringAfter("Hello World", " ") => "World"

lowercase.summary=Строка в нижнем регистре.
lowercase.params=str
lowercase.param.str=Строка; без аргумента — контекст
lowercase.result=Строка
lowercase.example.1=$lowercase("Hello") => "hello"

uppercase.summary=Строка в верхнем регистре.
uppercase.params=str
uppercase.param.str=Строка; без аргумента — контекст
uppercase.result=Строка
uppercase.example.1=$uppercase("Hello") => "HELLO"

length.summary=Длина строки в символах Unicode (эмодзи — один символ).
length.params=str
length.param.str=Строка; без аргумента — контекст
length.result=Число символов
length.example.1=$length("Привет") => 6

trim.summary=Строка без пробелов в начале и в конце; внутренние последовательности пробелов заменены одним пробелом.
trim.params=str
trim.param.str=Строка; без аргумента — контекст
trim.result=Строка
trim.example.1=$trim("  a   b  ") => "a b"

pad.summary=Строка, дополненная до ширины: положительная ширина — справа, отрицательная — слева.
pad.params=str,width,char
pad.param.str=Строка; без аргумента — контекст
pad.param.width=Итоговая ширина; знак задаёт сторону
pad.param.char=Символы дополнения; по умолчанию пробел
pad.result=Строка
pad.example.1=$pad("5", -3, "0") => "005"

match.summary=Все совпадения регулярного выражения: объекты с полями match, index и groups.
match.params=str,pattern,limit
match.param.str=Строка; без аргумента — контекст
match.param.pattern=Регулярное выражение (синтаксис JavaScript) или функция-матчер
match.param.limit=Наибольшее число совпадений
match.result=Массив совпадений
match.example.1=$match("a1b22", /\\d+/).match => ["1","22"]

contains.summary=Есть ли в строке подстрока или совпадение с регулярным выражением.
contains.params=str,pattern
contains.param.str=Строка; без аргумента — контекст
contains.param.pattern=Подстрока или регулярное выражение
contains.result=true или false
contains.example.1=$contains("Hello", /l+/) => true

replace.summary=Строка с заменой вхождений подстроки или регулярного выражения; в замене-строке $0, $1… — группы совпадения, замена может быть функцией.
replace.params=str,pattern,replacement,limit
replace.param.str=Строка; без аргумента — контекст
replace.param.pattern=Подстрока или регулярное выражение
replace.param.replacement=Строка замены или функция от объекта совпадения
replace.param.limit=Наибольшее число замен
replace.result=Строка
replace.example.1=$replace("a-b-c", "-", "+") => "a+b+c"

split.summary=Массив частей строки по разделителю (подстрока или регулярное выражение).
split.params=str,separator,limit
split.param.str=Строка; без аргумента — контекст
split.param.separator=Разделитель
split.param.limit=Наибольшее число частей
split.result=Массив строк
split.example.1=$split("a,b,c", ",") => ["a","b","c"]

join.summary=Строки массива, соединённые разделителем.
join.params=strings,separator
join.param.strings=Массив строк
join.param.separator=Разделитель; по умолчанию пустая строка
join.result=Строка
join.example.1=$join(["a", "b"], "-") => "a-b"

formatNumber.summary=Число по шаблону XPath fn:format-number (#,##0.00, проценты, экспонента), с настраиваемыми разделителями.
formatNumber.params=number,picture,options
formatNumber.param.number=Число; без аргумента — контекст
formatNumber.param.picture=Шаблон
formatNumber.param.options=Разделители и знаки: decimal-separator, grouping-separator и другие
formatNumber.result=Строка
formatNumber.example.1=$formatNumber(1234.5, "#,##0.00") => "1,234.50"

formatBase.summary=Целое число в системе счисления с основанием от 2 до 36.
formatBase.params=number,radix
formatBase.param.number=Число; без аргумента — контекст; дробная часть округляется
formatBase.param.radix=Основание; по умолчанию 10
formatBase.result=Строка
formatBase.example.1=$formatBase(255, 16) => "ff"

formatInteger.summary=Целое число по шаблону XPath fn:format-integer: цифры, римские цифры, слова.
formatInteger.params=number,picture
formatInteger.param.number=Число; без аргумента — контекст
formatInteger.param.picture=Шаблон: 0001, I, w и другие
formatInteger.result=Строка
formatInteger.example.1=$formatInteger(2024, "I") => "MMXXIV"

parseInteger.summary=Целое число из строки по шаблону fn:format-integer (обратная к $formatInteger).
parseInteger.params=str,picture
parseInteger.param.str=Строка; без аргумента — контекст
parseInteger.param.picture=Шаблон
parseInteger.result=Число
parseInteger.example.1=$parseInteger("MMXXIV", "I") => 2024

number.summary=Значение в виде числа: строка по правилам JSON (также 0x, 0b, 0o), true/false — 1/0.
number.params=value
number.param.value=Число, строка или логическое значение; без аргумента — контекст
number.result=Число
number.example.1=$number("12.5") => 12.5

floor.summary=Наибольшее целое, не превосходящее число.
floor.params=number
floor.param.number=Число; без аргумента — контекст
floor.result=Число
floor.example.1=$floor(-1.5) => -2

ceil.summary=Наименьшее целое, не меньшее числа.
ceil.params=number
ceil.param.number=Число; без аргумента — контекст
ceil.result=Число
ceil.example.1=$ceil(1.2) => 2

round.summary=Число, округлённое до заданного числа знаков; половина округляется к чётному (банковское округление).
round.params=number,precision
round.param.number=Число; без аргумента — контекст
round.param.precision=Число знаков после запятой; отрицательное — до десятков, сотен…
round.result=Число
round.example.1=$round(2.5) => 2

abs.summary=Модуль числа.
abs.params=number
abs.param.number=Число; без аргумента — контекст
abs.result=Число
abs.example.1=$abs(-3) => 3

sqrt.summary=Квадратный корень; для отрицательного числа — ошибка.
sqrt.params=number
sqrt.param.number=Число; без аргумента — контекст
sqrt.result=Число
sqrt.example.1=$sqrt(16) => 4

power.summary=Число в степени.
power.params=base,exponent
power.param.base=Основание; без аргумента — контекст
power.param.exponent=Показатель
power.result=Число
power.example.1=$power(2, 10) => 1024

random.summary=Случайное число от 0 (включительно) до 1 (не включительно).
random.params=
random.result=Число
random.example.1=$random() < 1 => true

boolean.summary=Значение как логическое по правилам JSONata: пустые строка, массив, объект, 0 и null — false.
boolean.params=value
boolean.param.value=Любое значение; без аргумента — контекст
boolean.result=true или false
boolean.example.1=$boolean([0, ""]) => false

not.summary=Логическое отрицание значения (по правилам $boolean).
not.params=value
not.param.value=Любое значение; без аргумента — контекст
not.result=true или false
not.example.1=$not("") => true

map.summary=Массив результатов функции для каждого элемента; функция получает значение, индекс и весь массив.
map.params=array,function
map.param.array=Массив
map.param.function=Функция (значение, индекс, массив)
map.result=Массив результатов (без отсутствующих значений)
map.example.1=$map([1, 2, 3], function($v){ $v * 10 }) => [10,20,30]

zip.summary=Массив кортежей: i-й кортеж — i-е элементы всех массивов; длина — по самому короткому.
zip.params=arrays
zip.param.arrays=Один или несколько массивов
zip.result=Массив массивов
zip.example.1=$zip([1, 2], ["a", "b"]) => [[1,"a"],[2,"b"]]

filter.summary=Элементы массива, для которых функция вернула истину.
filter.params=array,function
filter.param.array=Массив
filter.param.function=Предикат (значение, индекс, массив)
filter.result=Массив
filter.example.1=$filter([1, 2, 3, 4], function($v){ $v % 2 = 0 }) => [2,4]

single.summary=Единственный элемент массива, удовлетворяющий предикату; если их нет или больше одного — ошибка.
single.params=array,function
single.param.array=Массив
single.param.function=Предикат; без него — массив должен состоять из одного элемента
single.result=Элемент
single.example.1=$single([1, 2, 3], function($v){ $v > 2 }) => 3

reduce.summary=Свёртка массива функцией двух аргументов (накопленное значение, элемент), с необязательным начальным значением.
reduce.params=array,function,init
reduce.param.array=Массив
reduce.param.function=Функция (накопленное, значение, индекс, массив)
reduce.param.init=Начальное значение; без него — первый элемент
reduce.result=Итоговое значение
reduce.example.1=$reduce([1, 2, 3], function($acc, $v){ $acc + $v }) => 6

sift.summary=Объект из пар ключ-значение, для которых функция вернула истину.
sift.params=object,function
sift.param.object=Объект; без аргумента — контекст
sift.param.function=Предикат (значение, ключ, объект)
sift.result=Объект
sift.example.1=$sift({"a": 1, "b": 2}, function($v){ $v > 1 }) => {"b":2}

keys.summary=Ключи объекта (для массива объектов — уникальные ключи всех); порядок — как у объектов JavaScript.
keys.params=object
keys.param.object=Объект или массив объектов; без аргумента — контекст
keys.result=Массив строк
keys.example.1=$keys({"b": 1, "a": 2}) => ["b","a"]

lookup.summary=Значение по ключу; для массива объектов — значения из всех.
lookup.params=object,key
lookup.param.object=Объект или массив объектов; без аргумента — контекст
lookup.param.key=Ключ
lookup.result=Значение
lookup.example.1=$lookup({"a": 1}, "a") => 1

append.summary=Соединение двух значений в массив (значение, не являющееся массивом, считается массивом из одного элемента).
append.params=array1,array2
append.param.array1=Первое значение
append.param.array2=Второе значение
append.result=Массив
append.example.1=$append([1, 2], 3) => [1,2,3]

exists.summary=Есть ли значение (null — это значение).
exists.params=value
exists.param.value=Любое выражение
exists.result=true или false
exists.example.1=$exists(nothing) => false

spread.summary=Объект, разложенный на массив объектов из одной пары ключ-значение.
spread.params=object
spread.param.object=Объект или массив объектов; без аргумента — контекст
spread.result=Массив объектов
spread.example.1=$spread({"a": 1, "b": 2}) => [{"a":1},{"b":2}]

merge.summary=Объединение массива объектов в один; при совпадении ключа побеждает последний.
merge.params=objects
merge.param.objects=Массив объектов
merge.result=Объект
merge.example.1=$merge([{"a": 1}, {"b": 2}, {"a": 3}]) => {"a":3,"b":2}

reverse.summary=Массив в обратном порядке.
reverse.params=array
reverse.param.array=Массив
reverse.result=Массив
reverse.example.1=$reverse([1, 2, 3]) => [3,2,1]

each.summary=Массив результатов функции для каждой пары ключ-значение объекта.
each.params=object,function
each.param.object=Объект; без аргумента — контекст
each.param.function=Функция (значение, ключ, объект)
each.result=Массив
each.example.1=$each({"a": 1, "b": 2}, function($v, $k){ $k & "=" & $v }) => ["a=1","b=2"]

error.summary=Завершает вычисление ошибкой D3137 с заданным сообщением.
error.params=message
error.param.message=Сообщение ошибки
error.result=Не возвращает значения
error.example.1=$exists($error) => true

assert.summary=Если условие ложно — ошибка D3141 с заданным сообщением.
assert.params=condition,message
assert.param.condition=Проверяемое условие
assert.param.message=Сообщение ошибки
assert.result=Нет значения
assert.example.1=$assert(1 = 1, "не равно") => undefined

type.summary=Тип значения: null, number, string, boolean, array, object, function; для отсутствующего значения — нет значения.
type.params=value
type.param.value=Любое значение
type.result=Строка
type.example.1=$type([1]) => "array"

sort.summary=Массив, упорядоченный по возрастанию или функцией сравнения (устойчивая сортировка слиянием).
sort.params=array,function
sort.param.array=Массив
sort.param.function=Функция ($a, $b): истина, если $a должен идти после $b
sort.result=Массив
sort.example.1=$sort([3, 1, 2]) => [1,2,3]

shuffle.summary=Массив в случайном порядке.
shuffle.params=array
shuffle.param.array=Массив
shuffle.result=Массив
shuffle.example.1=$count($shuffle([1, 2, 3])) => 3

distinct.summary=Массив без повторяющихся значений (сравнение по значению, порядок первого вхождения).
distinct.params=array
distinct.param.array=Массив
distinct.result=Массив
distinct.example.1=$distinct([1, 2, 1, 3]) => [1,2,3]

base64encode.summary=Строка в кодировке Base64; символы кодируются в UTF-8 (отличие DEV-11).
base64encode.params=str
base64encode.param.str=Строка; без аргумента — контекст
base64encode.result=Строка Base64
base64encode.example.1=$base64encode("hi") => "aGk="

base64decode.summary=Строка из кодировки Base64; байты читаются как UTF-8 (отличие DEV-11).
base64decode.params=str
base64decode.param.str=Строка Base64; без аргумента — контекст
base64decode.result=Строка
base64decode.example.1=$base64decode("aGk=") => "hi"

encodeUrlComponent.summary=Строка, закодированная для компонента URL (encodeURIComponent).
encodeUrlComponent.params=str
encodeUrlComponent.param.str=Строка; без аргумента — контекст
encodeUrlComponent.result=Строка
encodeUrlComponent.example.1=$encodeUrlComponent("a b&c") => "a%20b%26c"

encodeUrl.summary=Строка, закодированная как URL целиком (encodeURI): разделители URL сохраняются.
encodeUrl.params=str
encodeUrl.param.str=Строка; без аргумента — контекст
encodeUrl.result=Строка
encodeUrl.example.1=$encodeUrl("http://x/a b") => "http://x/a%20b"

decodeUrlComponent.summary=Раскодированный компонент URL (decodeURIComponent).
decodeUrlComponent.params=str
decodeUrlComponent.param.str=Строка; без аргумента — контекст
decodeUrlComponent.result=Строка
decodeUrlComponent.example.1=$decodeUrlComponent("a%20b%26c") => "a b&c"

decodeUrl.summary=Раскодированный URL (decodeURI): закодированные разделители URL не раскодируются.
decodeUrl.params=str
decodeUrl.param.str=Строка; без аргумента — контекст
decodeUrl.result=Строка
decodeUrl.example.1=$decodeUrl("http://x/a%20b") => "http://x/a b"

eval.summary=Вычисляет строку как выражение JSONata с заданным контекстом.
eval.params=expr,context
eval.param.expr=Текст выражения
eval.param.context=Контекст вычисления; без него — текущий
eval.result=Результат выражения
eval.example.1=$eval("[1, 2, 3].($ * 2)") => [2,4,6]

toMillis.summary=Время в миллисекундах от эпохи Unix из строки ISO 8601 или по шаблону даты XPath; без смещения — UTC (отличие DEV-07).
toMillis.params=timestamp,picture
toMillis.param.timestamp=Строка даты и времени; без аргумента — контекст
toMillis.param.picture=Шаблон даты, например [Y0001]-[M01]-[D01]
toMillis.result=Число миллисекунд
toMillis.example.1=$toMillis("2018-02-01T09:42:13Z") => 1517478133000

fromMillis.summary=Строка даты и времени из миллисекунд от эпохи Unix: ISO 8601 или по шаблону XPath, в заданном часовом поясе.
fromMillis.params=millis,picture,timezone
fromMillis.param.millis=Число миллисекунд; без аргумента — контекст
fromMillis.param.picture=Шаблон даты; по умолчанию ISO 8601
fromMillis.param.timezone=Смещение пояса, например +0300
fromMillis.result=Строка
fromMillis.example.1=$fromMillis(1517478133000, "[Y0001]-[M01]-[D01]") => "2018-02-01"

clone.summary=Глубокая копия объекта или массива.
clone.params=value
clone.param.value=Объект или массив; без аргумента — контекст
clone.result=Копия
clone.example.1=$clone({"a": [1]}) => {"a":[1]}

now.summary=Время начала вычисления строкой ISO 8601 или по шаблону; одно и то же для всего вычисления.
now.params=picture,timezone
now.param.picture=Шаблон даты; по умолчанию ISO 8601
now.param.timezone=Смещение пояса
now.result=Строка
now.example.1=$type($now()) => "string"

millis.summary=Время начала вычисления в миллисекундах от эпохи Unix; одно и то же для всего вычисления.
millis.params=
millis.result=Число
millis.example.1=$millis() = $millis() => true
